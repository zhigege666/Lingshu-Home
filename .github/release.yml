# GitHub's optional "Generate release notes" UI configuration.
# The tag workflow intentionally uses the exact CHANGELOG.md version section;
# this file does not replace CHANGELOG maintenance or classify features as built.
# Reference: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: Features
      labels: [enhancement, feature]
    - title: Fixes
      labels: [bug, fix]
    - title: Documentation
      labels: [documentation]
    - title: Build and dependencies
      labels: [build, ci, dependencies]
    - title: Other changes
      labels: ["*"]
